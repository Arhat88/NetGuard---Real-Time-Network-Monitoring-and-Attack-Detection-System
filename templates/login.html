<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>IDS · Access Control</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link
    href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Exo+2:wght@300;400;500;600;700&display=swap"
    rel="stylesheet" />
  <style>
    :root {
      --bg: #ffffff;
      --surface: #ffffff;
      --border: #94a3b8;
      --accent: #0ea5e9;
      --accent2: #ef4444;
      --text: #000000;
      --muted: #1e293b;
      --success: #10b981;
      --mono: 'Share Tech Mono', monospace;
      --body: 'Exo 2', sans-serif;
    }

    *,
    *::before,
    *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: var(--body);
      font-weight: 500;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    /* Animated grid background */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background-image:
        linear-gradient(rgba(0, 212, 255, .04) 1px, transparent 1px),
        linear-gradient(90deg, rgba(0, 212, 255, .04) 1px, transparent 1px);
      background-size: 40px 40px;
      animation: gridScroll 20s linear infinite;
      pointer-events: none;
    }

    @keyframes gridScroll {
      from {
        background-position: 0 0;
      }

      to {
        background-position: 40px 40px;
      }
    }

    /* Scan line */
    body::after {
      content: '';
      position: fixed;
      left: 0;
      right: 0;
      height: 2px;
      background: linear-gradient(90deg, transparent, var(--accent), transparent);
      opacity: .3;
      animation: scanline 4s linear infinite;
      pointer-events: none;
    }

    @keyframes scanline {
      from {
        top: -2px;
      }

      to {
        top: 100vh;
      }
    }

    .card {
      position: relative;
      background: var(--surface);
      border: 1px solid var(--border);
      border-top: 2px solid var(--accent);
      width: 420px;
      padding: 40px 36px;
      box-shadow: 0 0 40px rgba(14, 165, 233, .1), 0 12px 24px rgba(0, 0, 0, .05);
      animation: fadeUp .5s ease both;
    }

    @keyframes fadeUp {
      from {
        opacity: 0;
        transform: translateY(20px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .logo {
      font-family: var(--mono);
      font-size: 11px;
      color: var(--accent);
      letter-spacing: 4px;
      text-transform: uppercase;
      margin-bottom: 4px;
    }

    h1 {
      font-size: 26px;
      font-weight: 700;
      letter-spacing: 1px;
      margin-bottom: 2px;
    }

    .subtitle {
      font-size: 12px;
      color: var(--muted);
      font-family: var(--mono);
      margin-bottom: 32px;
    }

    /* Tab switcher */
    .tabs {
      display: flex;
      border-bottom: 1px solid var(--border);
      margin-bottom: 28px;
    }

    .tab {
      flex: 1;
      padding: 10px;
      text-align: center;
      font-size: 13px;
      font-weight: 600;
      letter-spacing: 1px;
      text-transform: uppercase;
      cursor: pointer;
      color: var(--muted);
      border-bottom: 2px solid transparent;
      transition: all .2s;
    }

    .tab.active {
      color: var(--accent);
      border-bottom-color: var(--accent);
    }

    .form-group {
      margin-bottom: 18px;
    }

    label {
      display: block;
      font-size: 11px;
      font-family: var(--mono);
      letter-spacing: 2px;
      color: var(--muted);
      margin-bottom: 8px;
      text-transform: uppercase;
    }

    input {
      width: 100%;
      background: #fff;
      border: 1px solid var(--border);
      color: var(--text);
      font-family: var(--mono);
      font-size: 14px;
      font-weight: 600;
      padding: 12px 14px;
      outline: none;
      transition: border-color .2s, box-shadow .2s;
    }

    input:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(0, 212, 255, .1);
    }

    .btn {
      width: 100%;
      padding: 13px;
      background: var(--accent);
      color: #fff;
      border: none;
      font-family: var(--body);
      font-size: 14px;
      font-weight: 700;
      letter-spacing: 2px;
      text-transform: uppercase;
      cursor: pointer;
      margin-top: 8px;
      transition: all .2s;
      position: relative;
      overflow: hidden;
    }

    .btn::after {
      content: '';
      position: absolute;
      inset: 0;
      background: rgba(255, 255, 255, 0);
      transition: background .2s;
    }

    .btn:hover::after {
      background: rgba(255, 255, 255, .15);
    }

    .btn:active {
      transform: scale(.99);
    }

    .btn:disabled {
      opacity: .5;
      cursor: not-allowed;
    }

    .alert {
      padding: 10px 14px;
      font-size: 13px;
      font-family: var(--mono);
      border-left: 3px solid;
      margin-bottom: 18px;
      display: none;
    }

    .alert.error {
      border-color: var(--accent2);
      color: var(--accent2);
      background: rgba(255, 75, 75, .08);
    }

    .alert.success {
      border-color: var(--success);
      color: var(--success);
      background: rgba(0, 230, 118, .08);
    }

    .panel {
      display: none;
    }

    .panel.active {
      display: block;
    }

    .corner {
      position: absolute;
      width: 10px;
      height: 10px;
      border-color: var(--accent);
      border-style: solid;
      opacity: .5;
    }

    .corner.tl {
      top: -1px;
      left: -1px;
      border-width: 2px 0 0 2px;
    }

    .corner.tr {
      top: -1px;
      right: -1px;
      border-width: 2px 2px 0 0;
    }

    .corner.bl {
      bottom: -1px;
      left: -1px;
      border-width: 0 0 2px 2px;
    }

    .corner.br {
      bottom: -1px;
      right: -1px;
      border-width: 0 2px 2px 0;
    }
  </style>
</head>

<body>

  <div class="card">
    <div class="corner tl"></div>
    <div class="corner tr"></div>
    <div class="corner bl"></div>
    <div class="corner br"></div>

    <div class="logo">NetGuard</div>
    <h1>Access Control</h1>

    <div class="tabs">
      <div class="tab active" onclick="switchTab('login')">Login</div>
      <div class="tab" onclick="switchTab('register')">Register</div>
    </div>

    <div id="msg" class="alert"></div>

    <!-- LOGIN PANEL -->
    <div id="loginPanel" class="panel active">
      <div class="form-group">
        <label>Username</label>
        <input type="text" id="loginUser" placeholder="Enter username" autocomplete="username" />
      </div>
      <div class="form-group">
        <label>Password</label>
        <input type="password" id="loginPass" placeholder="••••••••" autocomplete="current-password" />
      </div>
      <button class="btn" id="loginBtn" onclick="doLogin()">Authenticate</button>
    </div>

    <!-- REGISTER PANEL -->
    <div id="registerPanel" class="panel">
      <div class="form-group">
        <label>Username</label>
        <input type="text" id="regUser" placeholder="Choose a username" />
      </div>
      <div class="form-group">
        <label>Email</label>
        <input type="email" id="regEmail" placeholder="you@example.com" />
      </div>
      <div class="form-group">
        <label>Password</label>
        <input type="password" id="regPass" placeholder="••••••••" />
      </div>
      <button class="btn" id="regBtn" onclick="doRegister()">Create Account</button>
    </div>
  </div>

  <script>
    function switchTab(tab) {
      document.querySelectorAll('.tab').forEach((t, i) =>
        t.classList.toggle('active', (i === 0) === (tab === 'login'))
      );
      document.getElementById('loginPanel').classList.toggle('active', tab === 'login');
      document.getElementById('registerPanel').classList.toggle('active', tab === 'register');
      hideMsg();
    }

    function showMsg(text, type) {
      const el = document.getElementById('msg');
      el.textContent = text;
      el.className = `alert ${type}`;
      el.style.display = 'block';
    }

    function hideMsg() {
      document.getElementById('msg').style.display = 'none';
    }

    async function doLogin() {
      const btn = document.getElementById('loginBtn');
      const username = document.getElementById('loginUser').value.trim();
      const password = document.getElementById('loginPass').value.trim();
      if (!username || !password) { showMsg('Please fill all fields', 'error'); return; }

      btn.disabled = true; btn.textContent = 'Authenticating...';
      try {
        const res = await fetch('/api/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username, password })
        });
        const data = await res.json();
        if (data.success) {
          showMsg('Access granted. Redirecting...', 'success');
          setTimeout(() => window.location.href = '/dashboard', 800);
        } else {
          showMsg(data.error || 'Authentication failed', 'error');
        }
      } catch { showMsg('Network error', 'error'); }
      finally { btn.disabled = false; btn.textContent = 'Authenticate'; }
    }

    async function doRegister() {
      const btn = document.getElementById('regBtn');
      const username = document.getElementById('regUser').value.trim();
      const email = document.getElementById('regEmail').value.trim();
      const password = document.getElementById('regPass').value.trim();
      if (!username || !email || !password) { showMsg('Please fill all fields', 'error'); return; }

      btn.disabled = true; btn.textContent = 'Creating...';
      try {
        const res = await fetch('/api/register', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username, email, password })
        });
        const data = await res.json();
        if (data.success) {
          showMsg('Account created! Please login.', 'success');
          setTimeout(() => switchTab('login'), 1200);
        } else {
          showMsg(data.error || 'Registration failed', 'error');
        }
      } catch { showMsg('Network error', 'error'); }
      finally { btn.disabled = false; btn.textContent = 'Create Account'; }
    }

    // Enter key support
    document.addEventListener('keydown', e => {
      if (e.key !== 'Enter') return;
      if (document.getElementById('loginPanel').classList.contains('active')) doLogin();
      else doRegister();
    });
  </script>
</body>

</html>
